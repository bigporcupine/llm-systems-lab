[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-systems-lab"
version = "0.1.0"
description = "A reproducible, experiment-driven lab for understanding and optimizing LLM systems."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Allen"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
production = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.34,<1"]
training = [
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "torch>=2.6,<3",
  "transformers>=5,<6",
]
exp002-transformers = [
  "accelerate>=1,<2",
  "fastapi>=0.115,<1",
  "torch>=2.6,<3",
  "transformers>=5,<6",
  "uvicorn>=0.34,<1",
]

[project.scripts]
llms-lab = "llm_systems_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
